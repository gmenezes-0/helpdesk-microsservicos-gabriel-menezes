name: Testes e segurança
on: [push, pull_request]

# O workflow só pode ler o código (privilégio mínimo)
permissions:
  contents: read

jobs:
  # Cada projeto é testado sozinho, com as suas próprias dependências
  testes:
    name: Testes · ${{ matrix.projeto }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # a falha de um projeto não esconde o resultado dos outros
      matrix:
        include:
          - projeto: monolito
            pasta: .
          - projeto: usuarios
            pasta: servicos/usuarios
          - projeto: inventario
            pasta: servicos/inventario
          - projeto: chamados
            pasta: servicos/chamados
          - projeto: notificacoes
            pasta: servicos/notificacoes
          - projeto: gateway
            pasta: gateway
          - projeto: segredo-jwt
            pasta: infra/segredo-jwt
    defaults:
      run:
        working-directory: ${{ matrix.pasta }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Testes (inclui testes de segurança)
        run: pytest -q
      - name: Dependências com falhas conhecidas
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt
          else
            echo "Sem dependências de execução (só a biblioteca padrão); auditando as de teste."
            pip-audit -r requirements-dev.txt
          fi

  # Sobe o sistema inteiro como na entrega e confere o básico pelo gateway
  compose:
    name: Docker Compose
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configuração válida
        run: docker compose config --quiet
      - name: Imagem do RabbitMQ fixada por digest
        run: grep -Eq '^FROM rabbitmq:4\.4\.1-alpine@sha256:[0-9a-f]{64}$' infra/rabbitmq/Dockerfile
      - name: Subir tudo
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: Conferir pelo gateway
        run: |
          set -eu
          curl -fsS http://127.0.0.1:8000/saude | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8000/saude | grep -q '"notificacoes":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/chamados)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/notificacoes)" = 401
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8000/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"carla@empresa.com","senha":"Helpdesk2026"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          curl -fsS http://127.0.0.1:8000/chamados -H "Authorization: Bearer $TOKEN" > /dev/null
          curl -fsS http://127.0.0.1:8000/ativos -H "Authorization: Bearer $TOKEN" > /dev/null
          # Só o gateway publica porta
          test "$(docker compose ps --format '{{.Service}} {{.Ports}}' | grep -c -- '->')" = 1
          docker compose ps --format '{{.Service}} {{.Ports}}' | grep -- '->' | grep -q '^gateway 127.0.0.1:8000->8000/tcp'
      - name: Entrega real de uma notificação (Chamados → RabbitMQ → Notificações)
        run: |
          set -eu
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8000/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"carla@empresa.com","senha":"Helpdesk2026"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          ID=$(curl -fsS -X POST http://127.0.0.1:8000/chamados -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"titulo":"Teste do CI","descricao":"Evento ponta a ponta","prioridade":"baixa"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/notificacoes -H "Authorization: Bearer $TOKEN" | grep -q "Seu chamado #$ID foi aberto"; then
              echo "Aviso do chamado #$ID entregue em ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "O aviso do chamado #$ID não chegou em 60 s"; exit 1
      - name: RabbitMQ endurecido
        run: |
          set -eu
          # só os dois usuários gerados (sem guest e sem administrador)
          test "$(docker compose exec -T rabbitmq rabbitmqctl -q list_users | tail -n +2 | sort | tr -s '\t ' ' ')" = "$(printf 'chamados []\nnotificacoes []')"
          # nenhum plugin ligado (nem painel, nem métricas)
          test -z "$(docker compose exec -T rabbitmq rabbitmq-plugins -q list -E)"
          # na rede, só a porta AMQP; o clustering fica no localhost
          docker compose exec -T rabbitmq rabbitmq-diagnostics -q listeners | tee /dev/stderr | grep -q '127.0.0.1, port: 25672'
          test "$(docker compose exec -T rabbitmq rabbitmq-diagnostics -q listeners | grep -c 'Interface')" = 2
          # mensagens mortas: nenhuma no fluxo normal
          docker compose exec -T rabbitmq rabbitmqctl -q list_queues -p helpdesk name messages | grep -Eq '^notificacoes\.eventos\.dlq\s+0$'
      - name: Logs (em caso de falha)
        if: failure()
        run: docker compose logs --no-color
      - name: Desligar
        if: always()
        run: docker compose down --volumes
