version: 2
updates:
  # Dependências Python de cada projeto (cada um tem o seu requirements.txt)
  - package-ecosystem: pip
    directories:
      - /                      # monólito
      - /servicos/usuarios
      - /servicos/inventario
      - /servicos/chamados
      - /servicos/notificacoes
      - /gateway
      - /infra/segredo-jwt     # só dependências de teste
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Imagem base de cada Dockerfile: python:3.12-slim nos serviços e
  # rabbitmq:4.4.1-alpine@sha256:... (fixada por versão e digest) em infra/rabbitmq
  - package-ecosystem: docker
    directories:
      - /
      - /servicos/usuarios
      - /servicos/inventario
      - /servicos/chamados
      - /servicos/notificacoes
      - /gateway
      - /infra/segredo-jwt
      - /infra/rabbitmq
    schedule:
      interval: weekly
