# Configuração do RabbitMQ do HelpDesk (substitui o 10-defaults.conf da imagem oficial)

# Usuários, vhost, permissões, exchanges e filas: gerados pelo segredo-jwt (só hashes de senha).
# Com definições para importar, o RabbitMQ não cria o usuário guest.
load_definitions = /etc/rabbitmq/definicoes/definicoes.json

listeners.tcp.default = 5672

log.console = true
log.console.level = info
log.file = false

# Limites para o ambiente de aula
vm_memory_high_watermark.absolute = 256MiB
disk_free_limit.absolute = 64MiB
